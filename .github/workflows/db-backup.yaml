name: supabase-backup

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight

env:
  BACKUP_ENABLED: true

jobs:
  run_db_backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      BACKUP_ENABLED: ${{ vars.BACKUP_ENABLED }} # Repository variable (true or false)

    steps:
      - name: Check if backups are enabled
        run: |
          if [ "$BACKUP_ENABLED" != "true" ]; then
            echo "Backups are disabled. Exiting workflow."
            exit 0
          fi

      - name: Checkout repository
        if: env.BACKUP_ENABLED == 'true'
        uses: actions/checkout@v3

      - name: Setup Supabase CLI
        if: env.BACKUP_ENABLED == 'true'
        uses: supabase/setup-cli@v1
        with:
          # Pin instead of "latest" to avoid GitHub API rate limits when
          # resolving the latest release.
          version: 2.120.0

      - name: Link Supabase project
        if: env.BACKUP_ENABLED == 'true'
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        working-directory: packages/thrift-api

      - name: Create timestamp folder
        if: env.BACKUP_ENABLED == 'true'
        run: mkdir -p db/backups
        working-directory: packages/thrift-api

      - name: Backup roles
        if: env.BACKUP_ENABLED == 'true'
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f db/backups/roles.sql --role-only
        working-directory: packages/thrift-api

      - name: Backup schema
        if: env.BACKUP_ENABLED == 'true'
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f db/backups/schema.sql
        working-directory: packages/thrift-api

      - name: Backup data
        if: env.BACKUP_ENABLED == 'true'
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f db/backups/data.sql --data-only --use-copy
        working-directory: packages/thrift-api

      - name: Upload backups to Supabase Storage
        if: env.BACKUP_ENABLED == 'true'
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          supabase storage cp db/backups/roles.sql ss:///backups/db/$TIMESTAMP/roles.sql --linked --experimental
          supabase storage cp db/backups/schema.sql ss:///backups/db/$TIMESTAMP/schema.sql --linked --experimental
          supabase storage cp db/backups/data.sql ss:///backups/db/$TIMESTAMP/data.sql --linked --experimental
        working-directory: packages/thrift-api

      - name: Delete old backups from Supabase Storage (> 3 months)
        if: env.BACKUP_ENABLED == 'true'
        run: |
          # Calculate timestamp for 3 months ago (approximately 90 days)
          # Note: This is an approximation. A more precise calculation would account for varying days in months.
          THREE_MONTHS_AGO=$(date -d "3 months ago" +%Y%m%d%H%M%S)

          echo "Deleting backups older than: $THREE_MONTHS_AGO"

          # List backup folders (which are timestamped)
          # Assuming backup folders are directly under ss:///backups/db/
          # The grep -oP 'db/\K[^/]+(?=/)' extracts just the timestamp folder name
          BACKUP_FOLDERS=$(supabase storage ls ss:///backups/db/ --experimental | grep -oP '.+(?=/$)')

          for FOLDER in $BACKUP_FOLDERS; do
            if [[ "$FOLDER" < "$THREE_MONTHS_AGO" ]]; then # String/Integer comparisons in YYYYMMDDHHMMSS format are interchangeable.
              echo "Deleting old backup folder: $FOLDER"
              # Supabase storage ls with the folder prefix will list all files inside
              # Use awk to extract just the file name (after the folder prefix)
              FILES_TO_DELETE=$(supabase storage ls "ss:///backups/db/$FOLDER/" --experimental | awk -F"db/$FOLDER/" '{print $2}')
              
              for FILE in $FILES_TO_DELETE; do
                echo "  Deleting file: ss:///backups/db/$FOLDER/$FILE"
                supabase storage rm "ss:///backups/db/$FOLDER/$FILE" --experimental
              done
              echo "  All files deleted under prefix ss:///backups/db/$FOLDER/"
            fi
          done
        env:
          # Pass Supabase access token for storage operations
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: packages/thrift-api
