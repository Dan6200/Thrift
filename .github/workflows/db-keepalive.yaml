name: keep-db-alive

on:
  schedule:
    # Runs every 3 days at 04:00 AM UTC
    - cron: "0 4 */3 * *"
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/products?select=product_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PROD_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PROD_PUBLISHABLE_KEY }}")
          echo "Supabase REST responded with HTTP $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Keep-alive ping failed (HTTP $STATUS)"
            exit 1
          fi
          echo "Database ping successful at $(date -u)"
