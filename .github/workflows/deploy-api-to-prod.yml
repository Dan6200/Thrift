name: Deploy API to Production

on:
  workflow_run:
    workflows: ["Thrift-api Testing"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    # Deploy automatically when tests pass, or on manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Deploy to Vercel
        # rootDirectory (packages/thrift-api) is set on the Vercel project, so
        # the CLI resolves the app, installs and builds it from the repo root.
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
