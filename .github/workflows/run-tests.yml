name: Thrift-api Testing

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SERVER: http://localhost:1027
      SUPABASE_URL: http://localhost:54321
      ACTIONS_STEP_DEBUG: true
      CI: true
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CLOUDINARY_CLOUD_NAME: dk6dujsds
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
      PAYSTACK_CALLBACK_URL: ${{ secrets.PAYSTACK_CALLBACK_URL }}
      # Point the app + QStash client at the local QStash dev server (below), and
      # at the CI server port so the async process-order job can be delivered.
      QSTASH_URL: http://localhost:8080
      APP_URL: http://localhost:1027

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start
        working-directory: packages/thrift-api

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      # Install workspace dependencies from the root
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build thrift-api
        run: pnpm --filter thrift-api build

      - name: Typecheck thrift-api
        run: pnpm --filter thrift-api typecheck

      - name: Coverage gate (unit)
        run: pnpm --filter thrift-api coverage:assistant

      - name: Start QStash dev server
        run: |
          curl -fsSL -o /tmp/qstash.tgz "https://artifacts.upstash.com/qstash/versions/2.40.12/qstash-server_2.40.12_linux_amd64.tar.gz"
          mkdir -p /tmp/qstash && tar -xzf /tmp/qstash.tgz -C /tmp/qstash
          /tmp/qstash/qstash dev > /tmp/qstash.log 2>&1 &
          sleep 5

      - name: Start server
        run: |
          pnpm --filter thrift-api test-server &> results.log &
          sleep 5
        working-directory: packages/thrift-api

      - name: Run tests
        run: pnpm --filter thrift-api test:ci

      - name: View results on failure
        if: failure()
        run: cat results.log
        working-directory: packages/thrift-api
