name: Thrift-api Testing

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SERVER: http://localhost:1024
      SUPABASE_URL: http://localhost:54321
      ACTIONS_STEP_DEBUG: true
      CI: true
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      CLOUDINARY_CLOUD_NAME: dk6dujsds

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start
        working-directory: packages/thrift-api

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      # Install workspace dependencies from the root
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build thrift-api
        run: pnpm --filter thrift-api build

      - name: Start server
        run: |
          pnpm --filter thrift-api test-server &> results.log &
          sleep 5
        working-directory: packages/thrift-api

      - name: Run tests
        run: pnpm --filter thrift-api tests

      - name: View results on failure
        if: failure()
        run: cat results.log
        working-directory: packages/thrift-api
